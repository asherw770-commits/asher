var _fbDb=firebase.firestore();
// no login: main state at /shared/main, photos in a separate /photos/{boyId}
// collection because a single Firestore doc caps at 1MB and per-boy photo
// arrays can push the whole state past that. world-readable per rules.
var _fbDocRef=_fbDb.collection('shared').doc('main');
var _fbPhotosCol=_fbDb.collection('photos');
// stamped at build time - lets each device show which deploy it's running
var _BUILD_STAMP='__BUILD_STAMP__';
// iOS PWAs cache the initial HTML in their own webkit container and DO NOT
// honor Cache-Control headers reliably - once installed to the home screen
// they can serve a version-frozen bundle for weeks. Fetch the live HTML on
// boot and on foreground; if the deployed BUILD_STAMP differs from ours,
// show a prominent banner the user can tap to reload into the new version.
async function _checkForUpdate(){
 try{
  var res=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
  if(!res.ok)return;
  var text=await res.text();
  var m=text.match(/_BUILD_STAMP\s*=\s*['"]([^'"]+)['"]/);
  if(m&&m[1]&&m[1]!==_BUILD_STAMP)_showUpdateBanner(m[1]);
 }catch(e){/* offline is fine */}
}
function _showUpdateBanner(newVer){
 if(document.getElementById('updBanner'))return;
 var el=document.createElement('div');
 el.id='updBanner';
 el.style.cssText='position:fixed;top:max(env(safe-area-inset-top),8px);left:8px;right:8px;z-index:999998;background:#c9a84c;color:#0a0f1c;padding:12px 16px;border-radius:12px;font-weight:800;font-size:15px;text-align:center;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.55);direction:rtl;font-family:Heebo,Arial,sans-serif';
 el.innerHTML='🆕 עדכון זמין ('+newVer+') — לחץ לטעון';
 el.onclick=function(){location.reload();};
 document.body.appendChild(el);
}
setTimeout(_checkForUpdate,2000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)_checkForUpdate();});
</script>

const prev=document.getElementById('reportPreview');
if(prev)prev.innerHTML='<div class="C" style="margin-top:8px;text-align:center"><div style="color:var(--go)">⏳ סורק...</div></div>';
const img=new Image();img.onload=function(){
  const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  const cx=cv.getContext('2d');cx.drawImage(img,0,0);
  const W=cv.width,H=cv.height;
  const id=cx.getImageData(0,0,W,H);
  const g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=Math.round((id.data[i*4]*299+id.data[i*4+1]*587+id.data[i*4+2]*114)/1000);
  
  var _r=scanWithBestGrid(g,W,H);
  if(_r){applyReport(_r,window._croppedImg,_r._pageDate||D._omrGridDate||td());return;}
  // Run same scanner as PDF
  const hL=[];
  for(let y=0;y<H;y++){let dk=0;for(let x=0;x<W;x++)if(g[y*W+x]<195)dk++;if(dk/W>0.15)hL.push(y)}
  const hCl=[];let ls=-999;for(const y of hL){if(y-ls>2)hCl.push(y);ls=y}
  const vL=[];
  for(let x=0;x<W;x++){let dk=0;for(let y=0;y<H;y++)if(g[y*W+x]<195)dk++;if(dk/H>0.08)vL.push(x)}
  const vCl=[];ls=-999;for(const x of vL){if(x-ls>2)vCl.push(x);ls=x}
  
  const cells2=[];
  for(let ri=0;ri<hCl.length-1;ri++)for(let ci=0;ci<vCl.length-1;ci++){
    const y1=hCl[ri]+1,y2=hCl[ri+1]-1,x1=vCl[ci]+1,x2=vCl[ci+1]-1;
    if(y2-y1<3||x2-x1<3)continue;
    cells2.push({x1,y1,x2,y2,w:x2-x1,h:y2-y1})}
  
  const cbs2=cells2.filter(c2=>c2.w>=8&&c2.h>=8&&c2.w<40&&c2.w/c2.h>0.3&&c2.w/c2.h<3);
  
  const grid=D._omrGrid||[];
  const result={phones_deposited:[],phones_late:[],phones_home:[],writing_done:[],
    afternoon_10sh:[],lights_outside:[],lights_10sh:[],bowls_ok:[],bowls_late:[],
    bowls_5sh:[],extra_chapters:[]};
  
  grid.forEach(gi=>{
    const tX=gi.px*W,tY=gi.py*H;
    let best=null,bD=Infinity;
    cbs2.forEach(cb=>{
      const cx2=(cb.x1+cb.x2)/2,cy2=(cb.y1+cb.y2)/2;
      const d=Math.sqrt((cx2-tX)**2+(cy2-tY)**2);
      if(d<bD){bD=d;best=cb}});
    if(!best||bD>W*0.05)return;
    const cy1=best.y1+2,cy2=best.y2-2,cx1=best.x1+2,cx2=best.x2-2;
    if(cy2<=cy1||cx2<=cx1)return;
    let dk=0,tot=0;
    for(let y=cy1;y<cy2;y++)for(let x=cx1;x<cx2;x++){tot++;if(g[y*W+x]<30)dk++}
    if(tot>0&&dk/tot>0.08){
      if(gi.type==='phone_ok')result.phones_deposited.push(gi.name);
      else if(gi.type==='phone_late')result.phones_late.push(gi.name);
      else if(gi.type==='phone_10sh')result.phones_home.push(gi.name);
      else if(gi.type==='wr_done')result.writing_done.push(gi.id);
      else if(gi.type==='af_10sh'||gi.type==='af_1y')result.afternoon_10sh.push(gi.name);
      else if(gi.type==='lo_out')result.lights_outside.push(gi.name);
      else if(gi.type==='lo_10sh')result.lights_10sh.push(gi.name);
      else if(gi.type==='bw_ok')result.bowls_ok.push(gi.name);
      else if(gi.type==='bw_late')result.bowls_late.push(gi.name);
      else if(gi.type==='bw_5sh')result.bowls_5sh.push(gi.name);
      else if(gi.type==='ex_ch')result.extra_chapters.push({name:gi.name,chapter:gi.ch})}
  });
  
  applyReport(result,window._croppedImg,D._omrGridDate||td());
};img.src=window._croppedImg}

function uploadReport(input){
if(!input.files||!input.files[0])return;
const file=input.files[0];
const prev=document.getElementById('reportPreview');
if(prev)prev.innerHTML='<div class="C" style="margin-top:8px;text-align:center"><div style="color:var(--go)">⏳ סורק...</div></div>';
const reader=new FileReader();
reader.onload=function(e){
const img=new Image();img.onload=function(){
  const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  const cx=cv.getContext('2d');cx.drawImage(img,0,0);
  const W=cv.width,H=cv.height;
  const id=cx.getImageData(0,0,W,H);
  // Grayscale
  const g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=Math.round((id.data[i*4]*299+id.data[i*4+1]*587+id.data[i*4+2]*114)/1000);
  
  // Detect horizontal lines (rows where >60% of pixels are dark)
  const hLines=[];
  for(let y=0;y<H;y++){let dk=0;for(let x=0;x<W;x++)if(g[y*W+x]<195)dk++;
    if(dk/W>0.15)hLines.push(y)}
  
  // Cluster horizontal lines (merge nearby ones)
  const hClusters=[];
  let last=-999;
  for(const y of hLines){if(y-last>3){hClusters.push(y)}last=y}
  
  // Detect vertical lines (cols where >40% dark)
  const vLines=[];
  for(let x=0;x<W;x++){let dk=0;for(let y=0;y<H;y++)if(g[y*W+x]<195)dk++;
    if(dk/H>0.08)vLines.push(x)}
  const vClusters=[];
  last=-999;
  for(const x of vLines){if(x-last>3){vClusters.push(x)}last=x}
  
  // Find cells: between consecutive h and v lines
  const cells=[];
  for(let ri=0;ri<hClusters.length-1;ri++){
    for(let ci=0;ci<vClusters.length-1;ci++){
      const y1=hClusters[ri]+2,y2=hClusters[ri+1]-2;
      const x1=vClusters[ci]+2,x2=vClusters[ci+1]-2;
      if(y2-y1<4||x2-x1<4)continue;
      cells.push({x1,y1,x2,y2,row:ri,col:ci,w:x2-x1,h:y2-y1});
    }
  }
  
  // Classify cells: narrow cells (w<50px) are checkboxes, wide are name cells
  // Check each checkbox cell for marks
  const grid=D._omrGrid||[];

  const checkMark=(cell)=>{
    // Check center only (shrink 2px each side to avoid borders)
    const cy1=cell.y1+2,cy2=cell.y2-2,cx1=cell.x1+2,cx2=cell.x2-2;
    if(cy2<=cy1||cx2<=cx1)return false;
    let dk=0,tot=0;
    for(let y=cy1;y<cy2;y++){
      for(let x=cx1;x<cx2;x++){
        tot++;if(g[y*W+x]<30)dk++;
      }
    }
    return tot>0&&(dk/tot)>0.08;
  };
  
  // Match cells to grid positions by row index
  // Group cells by row (same y range)
  const rows={};
  cells.forEach(cell=>{
    const ry=Math.round(cell.y1/10)*10;
    if(!rows[ry])rows[ry]=[];
    rows[ry].push(cell);
  });
  
  // Sort row keys and match to known student order
  const sortedRows=Object.keys(rows).map(Number).sort((a,b)=>a-b);
  
  // For each grid item, find the matching cell and check if marked
  const result={phones_deposited:[],phones_late:[],phones_home:[],writing_done:[],
    afternoon_10sh:[],lights_outside:[],lights_10sh:[],bowls_ok:[],bowls_late:[],
    bowls_5sh:[],extra_chapters:[]};
  
  // Match by approximate position
  grid.forEach(gi=>{
    const targetX=gi.px*W,targetY=gi.py*H;
    // Find closest checkbox cell
    let best=null,bestDist=Infinity;
    cells.forEach(cell=>{
      if(cell.w>40||cell.w<8||cell.h<8||cell.w>cell.h*3)return; // skip non-checkboxes
      const cx2=(cell.x1+cell.x2)/2,cy2=(cell.y1+cell.y2)/2;
      const d=Math.sqrt((cx2-targetX)**2+(cy2-targetY)**2);
      if(d<bestDist){bestDist=d;best=cell}
    });
    if(best&&bestDist<W*0.05&&checkMark(best)){
      if(gi.type==='phone_ok')result.phones_deposited.push(gi.name);
      else if(gi.type==='phone_late')result.phones_late.push(gi.name);
      else if(gi.type==='phone_10sh')result.phones_home.push(gi.name);
      else if(gi.type==='wr_done')result.writing_done.push(gi.id);
      else if(gi.type==='af_10sh'||gi.type==='af_1y')result.afternoon_10sh.push(gi.name);
      else if(gi.type==='lo_out')result.lights_outside.push(gi.name);
      else if(gi.type==='lo_10sh')result.lights_10sh.push(gi.name);
      else if(gi.type==='bw_ok')result.bowls_ok.push(gi.name);
      else if(gi.type==='bw_late')result.bowls_late.push(gi.name);
      else if(gi.type==='bw_5sh')result.bowls_5sh.push(gi.name);
      else if(gi.type==='ex_ch')result.extra_chapters.push({name:gi.name,chapter:gi.ch});
    }
  });
  
  const imgUrl=cv.toDataURL('image/jpeg',0.7);
  applyReport(result,imgUrl,D._omrGridDate||td());
};img.src=e.target.result};reader.readAsDataURL(file)}



function saveScan(imgB64,dateISO,info){
 try{
  if(!D._scans)D._scans=[];
  D._scans.push({d:dateISO||td(),at:new Date().toISOString(),
    cells:(info&&info._cells)||0,hits:(info&&info._hits)||0});
  while(D._scans.length>500)D._scans.shift();
  D._scans.forEach(function(x){if(x.img)delete x.img;});
  sv();
 }catch(err){}
}

function _dlFor(ch){var days=(ch==='קיט')?2:1;var d=new Date();
 for(var i=0;i<days;){d.setDate(d.getDate()+1);var w=d.getDay();
  if(w!==5&&w!==6&&!isSchoolHoliday(isoOf(d)))i++;}
 d.setHours(21,0,0,0);return d;}
function _mk(nm,ch,reason,dateISO){
 if(!D.pb.includes(nm))return null;
 var src=(dateISO||td())+'|'+ch+'|'+reason;
 // a second (or third...) genuine offense on the same day/chapter/reason is
 // now its own separate task, not silently merged away - only the id itself
 // still guards against a true accidental double-call with the same task
 var t={id:uid(),nm:nm,pk:[ch],dln:(ch==='קיט'?'2e':'te'),dl:_dlFor(ch).toISOString(),
   status:'waiting',x:1,rs:'other',ro:reason,src:src,ca:(dateISO?dateISO+'T20:00:00.000Z':new Date().toISOString())};
 D.wt.push(t);D.wh.push(Object.assign({},t));noteKit(t);return t;}

// builds the day sequence starting the day AFTER startDate: every calendar

// builds the day sequence starting FROM the given reference date itself
// (inclusive) - not the day after it. startSleepTable below decides whether
// that reference date should be today or tomorrow, based on the 8pm cutoff.
function buildSleepDays(startDate){

  d.setDate(d.getDate()+1);
 }
 return days;
}

function printHTML(html,title){
 // print straight from a hidden frame: the report never takes over the screen,
 // so on a phone you just cancel the print sheet and you are still in the app.
 //
 // iOS Safari (and several other mobile browsers) only allow window.print()
 // to fire when it is still inside the ORIGINAL synchronous click handler -
 // the "user activation" window is short and does not reliably survive an
 // async iframe onload plus an extra setTimeout. The previous version waited
 // for onload then added a further 350ms delay before calling print(), which
 // crossed that window often enough to silently block printing. Writing the
 // iframe synchronously via document.write (the report is fully self-contained,
 // no external resources to wait on) lets us call print() immediately, still
 // inside the same click, every time.
 var old=document.getElementById('printFrame');
 if(old&&old.parentNode)old.parentNode.removeChild(old);
 var f=document.createElement('iframe'); f.id='printFrame';
 f.setAttribute('aria-hidden','true');
 f.setAttribute('style','position:fixed;left:-10000px;top:0;width:1200px;height:900px;border:0;opacity:0;pointer-events:none');
 var cleaned=false;
 function cleanup(){if(cleaned)return;cleaned=true;
  setTimeout(function(){try{if(f.parentNode)f.parentNode.removeChild(f);}catch(e){}},1500);}
 function fallback(){
  cleanup();
  var w=null;try{w=window.open('','_blank');}catch(e){}
  if(w&&w.document){try{w.document.open();w.document.write(html);w.document.close();
    setTimeout(function(){try{w.focus();w.print();}catch(e){}},300);}catch(e){}}
  else showBanner('לא ניתן היה לפתוח את חלון ההדפסה',4000);
 }
 document.body.appendChild(f);
 try{
  var w=f.contentWindow, doc=f.contentDocument||(w&&w.document);
  if(!doc) return fallback();
  doc.open(); doc.write(html); doc.close(); // synchronous - no network resources to wait on
  if(w.addEventListener)w.addEventListener('afterprint',cleanup);
  if(w.matchMedia){var mq=w.matchMedia('print');
   if(mq&&mq.addListener)mq.addListener(function(m){if(!m.matches)cleanup();});}
  w.focus(); w.print(); // still inside the same synchronous click handler
  setTimeout(cleanup,90000);
 }catch(e){fallback();}
}

function sharePhoto(pid,sid){const s=D.cs.find(x=>x.id===sid);if(!s||!s.photos)return;

// Convert to blob and share/download

const ab=new Uint8Array(arr.length);for(let i=0;i<arr.length;i++)ab[i]=arr.charCodeAt(i);
const blob=new Blob([ab],{type:mime});const fn=(p.name||'photo')+'.jpg';
if(navigator.share&&navigator.canShare){const file=new File([blob],fn,{type:mime});
if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:p.name});return}}
// Fallback: download
const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fn;
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}catch(e){alert('שגיאה: '+e.message)}}

if(!D._whSync2){
const wtIds=new Set(D.wt.map(t=>t.id));
// Sync existing: update wh status from wt
D.wt.forEach(t=>{D.wh.forEach(h=>{if(h.id===t.id&&h.status!==t.status){h.status=t.status;if(t.doneAt)h.doneAt=t.doneAt}})});
// Fix orphans: if in wh but deleted from wt and still 'waiting', mark as cancelled
D.wh.forEach(h=>{if(!wtIds.has(h.id)&&(h.status==='waiting'||h.status==='late'||h.status==='doubled'))h.status='cancelled'});
D._whSync2=true;sv()}
// Clean empty conversations (from old card bug)
if(!D._cleanEmpty3){D.cx=D.cx.filter(c=>{
if((!c.sm||!c.sm.trim())&&(!c.du||c.du===0))return false;
if(c.du===0&&c.sm&&c.sm.includes('🎁'))return false;
return true});D._cleanEmpty3=true;sv()}
// Fix done tasks without doneAt
if(!D._fixDoneAt){
D.wt.forEach(t=>{if(t.status==='done'&&!t.doneAt){
const est=t.dl?new Date(t.dl):new Date(t.ca);est.setDate(est.getDate()+1);
t.doneAt=est.toISOString();t._estDoneAt=true}});
D.wh.forEach(t=>{if(t.status==='done'&&!t.doneAt){
const est=t.dl?new Date(t.dl):new Date(t.ca);est.setDate(est.getDate()+1);
t.doneAt=est.toISOString();t._estDoneAt=true}});
D._fixDoneAt=true;sv()}
rr();

function checkDailyReset(){try{
const now=new Date;const h=now.getHours(),m=now.getMinutes();
const today=tdEve();
if(h>=14&&D._lastResetDate!==today){
  // Reset all to "not deposited" and clear daily statuses
  D.pb.forEach(b=>{
    const st=gS(b);
    if(st==='away'||st==='np'){D.ps[b]={type:'normal'}}
    D.pt[b]=false;
    delete D.pt[b+'_t'];
  });
  D._lastResetDate=today;
  sv();rr();
}
// afternoon: once 14:00 passes, yesterday's afternoon round is over -
// save whatever was marked (even if the person never pressed the save
// button) before clearing the list for a fresh afternoon
if(h>=14&&D._lastAftResetDate!==today){
  var prevDay=new Date(now);prevDay.setDate(prevDay.getDate()-1);
  var prevISO=isoLocal(prevDay);
  if(D.ptA&&Object.keys(D.ptA).length&&(!D.phA||!D.phA[prevISO])){
    const ac=D.pb.filter(iA);
    if(!D.phA)D.phA={};
    D.phA[prevISO]={dp:ac.filter(b=>D.ptA[b]===true),m:ac.filter(b=>D.ptA[b]!==true),t:'\u05d0\u05d5\u05d8\u05d5\u05de\u05d8\u05d9'};
    snapDayStatus(prevISO,'aft');
  }
  D.ptA={};
  D._lastAftResetDate=today;
  sv();rr();
}
// evening: at 21:30 start a fresh round for tonight - save whatever the
// previous evening round had (again, even if never explicitly saved) before
// clearing, so nothing is lost just because the reset happens automatically
if((h>21||(h===21&&m>=30))&&D._lastEveResetDate!==today){
  if(D.pt&&Object.keys(D.pt).length&&(!D.ph||!D.ph[today])){
    const ac=D.pb.filter(iA);
    D.ph[today]={dp:ac.filter(b=>D.pt[b]===true),m:ac.filter(b=>D.pt[b]!==true),t:'\u05d0\u05d5\u05d8\u05d5\u05de\u05d8\u05d9'};
    snapDayStatus(today,'eve');
  }
  D.pb.forEach(b=>{D.pt[b]=false;delete D.pt[b+'_t'];});
  D._lastEveResetDate=today;
  sv();rr();
}
}catch{}}
setInterval(checkDailyReset,30000);
checkDailyReset();// run once on load
